[versions]
compileSdk = "32"
minSdk = "21"
targetSdk = "32"

agp = "8.0.2"
kotlin = "1.8.10"
dokka = "1.9.20"
mavenPublish = "0.25.3"

appcompat = "1.2.0"
constraintlayout = "1.1.3"
recyclerview = "1.2.1"

junit = "4.13.2"
androidxJunit = "1.1.5"
espresso = "3.5.1"

viewpager2 = "1.0.0"
photoview = "2.3.0"

coil = "2.2.0"
glide = "4.16.0"
picasso = "2.8"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }

androidx-viewpager2 = { group = "androidx.viewpager2", name = "viewpager2", version.ref = "viewpager2" }
chrisbanes-photoview = { group = "com.github.chrisbanes", name = "PhotoView", version.ref = "photoview" }

bumptech-glide = { group = "com.github.bumptech.glide", name = "glide", version.ref = "glide" }
bumptech-glide-compiler = { group = "com.github.bumptech.glide", name = "compiler", version.ref = "glide" }
squareup-picasso = { group = "com.squareup.picasso", name = "picasso", version.ref = "picasso" }
coil = { group = "io.coil-kt", name = "coil", version.ref = "coil" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
